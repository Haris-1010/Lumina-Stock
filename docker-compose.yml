services:
  postgres:
    image: postgres:16-alpine
    container_name: lumina-postgres
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: lumina_stock
    volumes:
      - lumina_pgdata:/var/lib/postgresql/data

volumes:
  lumina_pgdata:
